# Blueprint de Render: crea la base PostgreSQL y el servicio web conectados entre sí
services:
  - type: web
    name: biblioteca-backend-mc
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: biblioteca-db
          property: connectionString
      - key: DB_SSL
        value: "false"

databases:
  - name: biblioteca-db
    plan: free
    databaseName: biblioteca
    user: biblioteca
